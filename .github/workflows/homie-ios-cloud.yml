name: Homie iOS signed IPA

on:
  push:
    branches:
      - codex/large-flat-dual-platform
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused App Store Connect build number
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  archive:
    if: github.repository == 'kasilindiea/homie' && github.ref == 'refs/heads/codex/large-flat-dual-platform'
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number || '1' }}
      TEAM_ID: 4X33LDKNXN
      BUNDLE_ID: com.homing.furniture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build and sync the bundled web app
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          npm ci
          npm test
          npm run build
          npx --no-install cap sync ios
      - name: Sign, archive and export an App Store Connect IPA
        env:
          P12: ${{ secrets.HOMIE_IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.HOMIE_IOS_P12_PASSWORD }}
          ARTIFACT_PASSWORD: ${{ secrets.HOMIE_IOS_ARTIFACT_PASSWORD }}
          PROFILE: ${{ secrets.HOMIE_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in P12 P12_PASSWORD PROFILE ARTIFACT_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing configuration ($name)"
              exit 1
            fi
          done

          signing_dir="$(mktemp -d)"
          keychain="$signing_dir/build.keychain-db"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$signing_dir"' EXIT
          printf '%s' "$P12" | base64 -D > "$signing_dir/identity.p12"
          printf '%s' "$PROFILE" | base64 -D > "$signing_dir/homie.mobileprovision"
          security cms -D -i "$signing_dir/homie.mobileprovision" > "$signing_dir/profile.plist"

          python3 - "$signing_dir/profile.plist" <<'PY'
          import datetime, os, plistlib, sys
          with open(sys.argv[1], "rb") as source:
              profile = plistlib.load(source)
          entitlements = profile["Entitlements"]
          team = os.environ["TEAM_ID"]
          assert entitlements["application-identifier"] == team + "." + os.environ["BUNDLE_ID"]
          assert entitlements["com.apple.developer.team-identifier"] == team
          assert not profile.get("ProvisionedDevices") and not profile.get("ProvisionsAllDevices")
          assert entitlements.get("get-task-allow") is False
          assert profile["ExpirationDate"] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          PY

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$signing_dir/profile.plist")"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          xcode_profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir" "$xcode_profile_dir"
          cp "$signing_dir/homie.mobileprovision" "$profile_dir/$profile_uuid.mobileprovision"
          cp "$signing_dir/homie.mobileprovision" "$xcode_profile_dir/$profile_uuid.mobileprovision"

          keychain_password="$(openssl rand -hex 24)"
          umask 077
          export KEYCHAIN_IMPORT_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_IMPORT_PASSWORD"
          if ! openssl pkcs12 -in "$signing_dir/identity.p12" -passin env:P12_PASSWORD \
              -passout env:KEYCHAIN_IMPORT_PASSWORD -out "$signing_dir/identity.pem"; then
            echo "::error::OpenSSL could not unlock the original P12 with the configured Secret."
            exit 1
          fi
          openssl pkcs12 -export -legacy -macalg sha1 -in "$signing_dir/identity.pem" \
            -passin env:KEYCHAIN_IMPORT_PASSWORD -passout env:KEYCHAIN_IMPORT_PASSWORD \
            -out "$signing_dir/keychain.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/keychain.p12" -P "$KEYCHAIN_IMPORT_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          unset KEYCHAIN_IMPORT_PASSWORD P12_PASSWORD P12 PROFILE
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          project=ios/App/App.xcodeproj
          archive="$RUNNER_TEMP/Homie.xcarchive"
          mkdir -p artifacts/ios
          xcodebuild archive -project "$project" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$profile_uuid" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          options="$signing_dir/ExportOptions.plist"
          python3 - "$options" "$profile_uuid" <<'PY'
          import os, plistlib, sys
          with open(sys.argv[1], "wb") as output:
              plistlib.dump({
                  "method": "app-store-connect",
                  "destination": "export",
                  "teamID": os.environ["TEAM_ID"],
                  "signingStyle": "manual",
                  "signingCertificate": "Apple Distribution",
                  "provisioningProfiles": {os.environ["BUNDLE_ID"]: sys.argv[2]},
                  "manageAppVersionAndBuildNumber": False,
              }, output)
          PY

          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$options" \
            -exportPath "$signing_dir/export"
          cp "$signing_dir/export/"*.ipa "$signing_dir/Homie.ipa"
          unzip -q "$signing_dir/Homie.ipa" -d "$signing_dir/package"
          app="$(find "$signing_dir/package/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)"
          codesign --verify --deep --strict "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" == "$BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" == "$BUILD_NUMBER" ]]
          diff -qr ios/App/App/public "$app/public"
          git rev-parse HEAD > artifacts/ios/source-commit.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -md sha256 \
            -in "$signing_dir/Homie.ipa" -out artifacts/ios/Homie.ipa.enc -pass env:ARTIFACT_PASSWORD
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -md sha256 \
            -in "$signing_dir/export/AppStoreInfo.plist" -out artifacts/ios/AppStoreInfo.plist.enc -pass env:ARTIFACT_PASSWORD
          (cd artifacts/ios && shasum -a 256 Homie.ipa.enc AppStoreInfo.plist.enc > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: homie-ios-signed
          path: artifacts/ios/
          retention-days: 3
          if-no-files-found: error
